name: Monitor AR - control de auditoría y trazabilidad
on:
  pull_request:
    paths: ['data/series_ar_auditoria.json', 'scripts/auditoria_ar.js', 'tests/test_series_ar_auditoria.py', 'tests/test_monitor_ar.py', 'data/indicadores.json', 'monitor_ar.html', 'index.html', '.github/workflows/auditoria-ar.yml']
  push:
    branches: [main]
    paths: ['data/series_ar_auditoria.json', 'scripts/auditoria_ar.js', 'tests/test_series_ar_auditoria.py', 'tests/test_monitor_ar.py', 'data/indicadores.json', 'monitor_ar.html', 'index.html', '.github/workflows/auditoria-ar.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check scripts/auditoria_ar.js
      - run: python -m unittest discover -s tests -p 'test_*ar*.py'
