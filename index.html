<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ivanna Travaini</title>
<style>
:root {
  --bg: #F5F7FA;
  --fg: #0D1B2A;
  --fg-dim: #5A7A9A;
  --accent: #1D4ED8;
  --border: #D8E3EF;
  --surface: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F18; --fg: #DCE8F5; --fg-dim: #7A9ABF;
    --accent: #5B9CF6; --border: #1E2E45; --surface: #141C2B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F18; --fg: #DCE8F5; --fg-dim: #7A9ABF;
  --accent: #5B9CF6; --border: #1E2E45; --surface: #141C2B;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 36px 40px;
  max-width: 480px;
  width: 100%;
  text-align: center;
}
h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.sub { font-size: 14px; color: var(--fg-dim); margin-bottom: 32px; }
.link-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: 8px;
  text-decoration: none;
  color: var(--fg);
  transition: border-color .15s, background .15s;
  text-align: left;
}
.link-item:hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 5%, var(--surface));
}
.link-icon {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.link-label { font-size: 14px; font-weight: 600; }
.link-desc { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
.footer { margin-top: 28px; font-size: 12px; color: var(--fg-dim); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div class="card">
  <h1>Ivanna Travaini</h1>
  <p class="sub">Análisis político · Opinión pública · Buenos Aires</p>

  <a class="link-item" href="/monitor-ar.html">
    <div class="link-icon">📊</div>
    <div>
      <div class="link-label">Monitor AR</div>
      <div class="link-desc">Seguimiento de opinión pública argentina</div>
    </div>
  </a>

  <p class="footer">ivannatravaini.netlify.app</p>
</div>
</body>
</html>
