<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada</title>
<style>
:root{--bg:#071526;--surface:#0D1E35;--border:#162B48;--text:#E8F0FA;--muted:#8AAFC8;--accent:#5B9CF6;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.caja{max-width:440px;text-align:center}
h1{font-size:2.6rem;color:var(--accent);font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
p.lead{font-size:1rem;margin-bottom:6px}
p.sub{font-size:.88rem;color:var(--muted);margin-bottom:22px}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a{font-size:.84rem;font-weight:600;color:var(--accent);text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:9px 18px;transition:all .15s;display:inline-block}
a:hover,a:focus{background:var(--accent);color:#071526;border-color:var(--accent);outline:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="caja">
  <h1>404</h1>
  <p class="lead">Esta página no está disponible.</p>
  <p class="sub">La dirección no existe o corresponde a material de trabajo que no se publica en el sitio.</p>
  <div class="links">
    <a href="/">Inicio</a>
    <a href="/monitor_leg">Monitor LEG</a>
    <a href="/monitor_ar">Monitor AR</a>
  </div>
</div>
</body>
</html>
