<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor LEG</title>
<style>
:root {
  --bg:#071526;--surface:#0D1E35;--border:#162B48;--text:#E8F0FA;--muted:#8AAFC8;
  --accent:#5B9CF6;--accent-light:#0D2040;
  --red:#F06070;--red-bg:#2A0D12;
  --yellow:#F5A623;--yellow-bg:#2A1D08;
  --green:#22C07A;--green-bg:#082516;
  --grey:#8AAFC8;--grey-bg:#0D1E35;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;padding:0 16px 60px}
.wrap{max-width:960px;margin:0 auto}
header{border-bottom:2px solid var(--accent);padding:18px 0 10px;margin-bottom:16px}
header .kicker{font-family:'Arial',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
header h1{font-size:1.25rem;color:var(--accent)}
header .meta{font-family:'Arial',sans-serif;font-size:11px;color:var(--muted);margin-top:4px}
.corte{display:inline-block;background:var(--yellow-bg);color:var(--yellow);border:1px solid #5a3a0a;border-radius:4px;padding:1px 6px;font-size:11px;font-family:'Arial',sans-serif;font-weight:600}
.aviso{background:var(--yellow-bg);border-left:4px solid var(--yellow);padding:6px 10px;border-radius:0 5px 5px 0;margin:8px 0 16px;font-family:'Arial',sans-serif;font-size:11.5px;color:var(--yellow)}
section{margin-bottom:20px}
h2{font-family:'Arial',sans-serif;font-size:.85rem;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.02em}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:10px}
th{background:#0D2040;color:var(--accent);font-family:inherit;font-size:.72rem;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border);padding:6px 8px;vertical-align:top}
tr:nth-child(even) td{background:var(--surface)}
tr[hidden]{display:none}
.filtros{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.filtros button{font-family:'Arial',sans-serif;font-size:.73rem;font-weight:700;padding:3px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.filtros button:hover{border-color:var(--accent);color:var(--accent)}
.filtros button.activo{background:var(--accent);color:#071526;border-color:var(--accent)}
.tag{display:inline-block;font-family:'Arial',sans-serif;font-size:.62rem;font-weight:700;padding:1px 4px;border-radius:8px;white-space:nowrap;margin-right:2px}
.tag-cond{background:var(--red-bg);color:var(--red)}
.tag-preg{background:var(--accent-light);color:var(--accent)}
.tag-cuest{background:var(--yellow-bg);color:var(--yellow)}
.tag-decl{background:var(--grey-bg);color:var(--grey)}
.badge-lla{display:inline-block;background:#2A0D12;color:var(--red);border:1px solid #5a1a20;font-family:'Arial',sans-serif;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:10px}
.badge-fxba{display:inline-block;background:var(--accent-light);color:var(--accent);border:1px solid #1a3a6a;font-family:'Arial',sans-serif;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:10px}
.badge-cd{display:inline-block;background:var(--green-bg);color:var(--green);border:1px solid #0d4a2a;font-family:'Arial',sans-serif;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:10px}
.mosaico-par{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:640px){.mosaico-par{grid-template-columns:1fr}}
.mosaico-tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:start}
.mtile{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:.78rem;line-height:1.35}
.mtile-red{border-left:3px solid var(--red);background:var(--red-bg)}
.mtile-blue{border-left:3px solid var(--accent);background:var(--accent-light)}
.mtile-yellow{border-left:3px solid var(--yellow);background:var(--yellow-bg)}
.mtile-grey{border-left:3px solid var(--border);background:var(--grey-bg)}
.mtile-green{border-left:3px solid var(--green);background:var(--green-bg)}
.mtile .tl{font-family:'Arial',sans-serif;font-size:.65rem;font-weight:700;color:var(--red);margin-bottom:1px}
.mtile-blue .tl{color:var(--accent)}
.mtile-yellow .tl{color:var(--yellow)}
.mtile-grey .tl{color:var(--muted)}
.mtile-green .tl{color:var(--green)}
.divider{border:none;border-top:1px dashed var(--border);margin:14px 0}
.cifra{font-family:'Arial',sans-serif;font-size:.8rem;color:var(--accent)}
footer{font-family:'Arial',sans-serif;font-size:10.5px;color:var(--muted);margin-top:24px;border-top:1px solid var(--border);padding-top:8px}
</style>
</head>
<body>
<div class="wrap">
{{CONTENT}}
</div>
<script>
function filtrar(b,btn){
  document.querySelectorAll('.filtros button').forEach(x=>x.classList.remove('activo'));
  btn.classList.add('activo');
  document.querySelectorAll('#tabla-bloques tbody tr').forEach(tr=>{
    tr.hidden=b!=='todos'&&tr.dataset.bloque!==b;
  });
}
</script>
</body>
</html>
