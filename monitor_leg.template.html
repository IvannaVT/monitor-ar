<script>
// Apply the saved appearance before the first paint; blue dark is the default.
try {
 const savedTheme = localStorage.getItem('monitor-leg-theme');

<script>
function setTheme(theme){
 const selected = theme === 'light' ? 'light' : 'dark';
 document.documentElement.dataset.theme = selected;
 document.querySelectorAll('[data-theme-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.themeChoice === selected)));
 try { localStorage.setItem('monitor-leg-theme',selected); } catch (_) { /* The switch still works without storage. */ }
}
setTheme(document.documentElement.dataset.theme);
function abrirPanel(id,event){
 const panel=document.getElementById(id);
 if(!panel || panel.tagName!=='DIALOG')return;
 if(event)event.preventDefault();
 if(!panel.open)panel.showModal();
}
function cerrarPanel(id){
 const panel=document.getElementById(id);
 if(panel && panel.open)panel.close();
}
document.querySelectorAll('a[data-panel]').forEach(link=>link.addEventListener('click',event=>abrirPanel(link.dataset.panel,event)));
// Preserve direct links to the former long sections without showing them below.
function panelDesdeEnlace(){
 const id=location.hash.slice(1);
 if(id==='agenda'||id==='rondas')abrirPanel(id);
}
window.addEventListener('hashchange',panelDesdeEnlace);
panelDesdeEnlace();
function filtrar(b,btn){
 document.querySelectorAll('.filtros button').forEach(x=>{x.classList.remove('activo');x.setAttribute('aria-pressed','false');});
 btn.classList.add('activo');btn.setAttribute('aria-pressed','true');
 document.querySelectorAll('#tabla-bloques tbody tr').forEach(tr=>{tr.hidden=b!=='todos'&&tr.dataset.bloque!==b;});
}</script>
